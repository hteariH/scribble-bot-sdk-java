group=io.github.htearih.scribble
version=0.4.0

# The upstream TypeScript SDK release this port is known to match. The sync routine stops when this
# is at or ahead of @scribble-pub/bot-sdk's `latest` tag — so this is the only piece of state the
# whole automation keeps. See docs/upstream-sync.md.
#
# It is 0.4.0 while npm's `latest` still says 0.3.0: this port tracks upstream's 0.4.0 before
# upstream has tagged it, and "ahead" is what keeps the sync routine from re-porting the 0.3.0 it
# was told to skip.
#
# 0.4.0 was released from here on that basis — deliberately, ahead of upstream's own tag. If
# upstream's 0.4.0 lands differing from what this port read off their `main`, the difference is a
# 0.4.1, never a re-cut 0.4.0: Central releases are immutable.
upstreamVersion=0.4.0

org.gradle.parallel=true
org.gradle.caching=true

# Published POM metadata (kept here so every module says the same thing).
pomUrl=https://github.com/hteariH/scribble-bot-sdk-java
pomScmConnection=scm:git:https://github.com/hteariH/scribble-bot-sdk-java.git
pomScmDeveloperConnection=scm:git:ssh://git@github.com/hteariH/scribble-bot-sdk-java.git
pomDeveloperId=hteariH
pomDeveloperName=hteariH
