name: publish

# Releases both artifacts. Triggered by publishing a GitHub release, or by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        default: both
        options: [both, github-packages, maven-central]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ github.event.inputs.target || 'both' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The version comes from gradle.properties, not the tag, so a release cut before bumping it
      # would ship whatever main carries — usually a -SNAPSHOT. Fail before anything is published.
      - name: Check the version is a release, and the tag's
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties)
          echo "version=$VERSION"
          case "$VERSION" in
            ''|*-SNAPSHOT) echo "::error::'$VERSION' is not a release version; set it in gradle.properties first"; exit 1 ;;
          esac
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag $TAG does not match version $VERSION in gradle.properties"
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}

      - run: ./gradlew build --no-daemon

      # GitHub Packages. Public, but consumers still need a token to read it — Maven Central is
      # the one that works with a bare dependency declaration.
      - name: Publish to GitHub Packages
        if: env.TARGET == 'both' || env.TARGET == 'github-packages'
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Maven Central, via the Portal Publisher API: one zip of a Maven-layout repository.
      - name: Build the Central bundle
        if: env.TARGET == 'both' || env.TARGET == 'maven-central'
        run: ./gradlew centralBundle --no-daemon
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload to Maven Central
        if: env.TARGET == 'both' || env.TARGET == 'maven-central'
        run: |
          AUTH=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $AUTH" \
            -F bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}&publishingType=USER_MANAGED"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
